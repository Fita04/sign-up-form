<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="logo-and-background">
        <p class="logo-text-header">Apollo</p>
        <p>Photo by <a href="https://unsplash.com/@ktabori?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Krisztian Tabori</a> on <a href="https://unsplash.com/photos/a-blurry-photo-of-a-television-screen-nZGNVOvEYio?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
    </div>
    <div class="sign-up-form-and-header">
        <header class="form-header-text">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
            <p>You <em>know</em> you want to.</p>
        </header>
        <div class="sign-up-form">
            <form action="" method="get">
                <fieldset>
                    <legend>Let's do this</legend>
                    <label for="first-name">First name</label>
                    <input type="text" name="first-name" id="first-name">

                    <label for="last-name">Last name</label>
                    <input type="text" name="last-name" id="last-name">

                    <label for="user_email">Email address</label>
                    <input type="email" name="user_email" id="user_email">

                    <label for="user_number">Phone number</label>
                    <input type="tel" name="user_number" id="user_number">

                    <label for="user_password">Password</label>
                    <input type="password" name="user_password" id="user_password">

                     <label for="user_password">Confirm password</label>
                    <input type="password" name="user_password" id="user_password">
                </fieldset>

                <button type="submit">Create account</button>
            </form>

            <p>Already have an account? <a class="log-in-link">Log in</a></p>
        </div>
    </div>
</body>
</html>
